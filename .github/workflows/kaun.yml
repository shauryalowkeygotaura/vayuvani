name: Kaun hourly attribution

on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 (off the :00 rush; CPCB hours land by then)
  workflow_dispatch:
    inputs:
      region:
        description: "Airshed (attribution/regions.py id). Delhi NCR is the default and the cron."
        default: delhi-ncr
        type: choice
        options: [delhi-ncr, mumbai, kolkata, bengaluru, chennai, hyderabad, ahmedabad, pune, lucknow, kanpur, patna, jaipur, chandigarh, varanasi]

# One group for every region: runs share the checkout, the Pages artifact and
# the runner's state directory, so they must not overlap.
concurrency:
  group: kaun-hourly
  cancel-in-progress: false

env:
  KAUN_REGION: ${{ inputs.region || 'delhi-ncr' }}
  KAUN_STATE_DIR: .kaun_state

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-engine.txt

      # Checkpoint carried between runs (per region): restore the newest, save under a new key.
      - name: Restore checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .kaun_state
          key: kaun-state-${{ env.KAUN_REGION }}-${{ github.run_id }}
          restore-keys: kaun-state-${{ env.KAUN_REGION }}-

      - name: Tests
        run: python -m pytest

      - name: Ingest, attribute, publish, queue
        id: kaun
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          KAUN_AGENCY_CONTACTS: ${{ secrets.KAUN_AGENCY_CONTACTS }}
        run: python -m attribution.run hourly

      - name: Save checkpoint
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .kaun_state
          key: kaun-state-${{ env.KAUN_REGION }}-${{ github.run_id }}

      - name: Check feed is fresh
        id: check
        run: |
          if [ "$KAUN_REGION" = "delhi-ncr" ]; then f=public/data/latest.json; else f=public/data/$KAUN_REGION/latest.json; fi
          test -s "$f" || { echo "no feed written"; exit 1; }
          age=$(( $(date +%s) - $(stat -c %Y "$f") ))
          echo "feed age ${age}s"
          test "$age" -lt 1800 || { echo "feed is stale"; exit 1; }
          echo "published=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Pages serves the whole public/ folder from one artifact, so only the Delhi
  # run deploys for now: a second region's run would publish a site without
  # Delhi's feed. Other regions keep their results in Supabase and the artifact
  # until the feed moves to per-region branches.
  deploy:
    needs: run
    if: needs.run.outputs.published == 'true' && (!inputs.region || inputs.region == 'delhi-ncr')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  alert:
    needs: [run, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "Kaun hourly run failing";
            const body = `Run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: "open", labels: "kaun-alert"});
            const hit = issues.find(i => i.title === title);
            if (hit) await github.rest.issues.createComment({...context.repo, issue_number: hit.number, body});
            else await github.rest.issues.create({...context.repo, title, body, labels: ["kaun-alert"]});
