name: Kaun daily agency reports

# One digest per agency per day. Sends autonomously only when the repo
# variable KAUN_AUTO_SEND is "1" AND the agency email is verified in
# reporting/contacts.json; otherwise reports are held for one-tap approval.
# Pause everything: set repo variable KAUN_REPORTS_PAUSED to "1".

on:
  schedule:
    - cron: "41 4 * * *"   # 10:11 IST, office hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, send nothing"
        type: boolean
        default: false

concurrency:
  group: kaun-report
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-engine.txt
      - name: Send digests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          KAUN_AGENCY_CONTACTS: ${{ secrets.KAUN_AGENCY_CONTACTS }}
          KAUN_AUTO_SEND: ${{ vars.KAUN_AUTO_SEND }}
          KAUN_REPORTS_PAUSED: ${{ vars.KAUN_REPORTS_PAUSED }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          REPORT_REPLY_TO: ${{ secrets.REPORT_REPLY_TO }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python -m reporting.digest $DRY_RUN
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outbox
          path: .kaun_state/outbox
          if-no-files-found: ignore
      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Kaun daily reports failing";
            const body = `Run failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: "open", labels: "kaun-alert"});
            const hit = issues.find(i => i.title === title);
            if (hit) await github.rest.issues.createComment({...context.repo, issue_number: hit.number, body});
            else await github.rest.issues.create({...context.repo, title, body, labels: ["kaun-alert"]});
