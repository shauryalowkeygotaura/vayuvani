name: Kaun approve report

# One-tap human decision on a queued report (GitHub app: Actions -> Kaun
# approve report -> Run workflow). Needed when KAUN_AUTO_SEND is off; with it
# on, use "reject" to stop a report before the next daily digest.

on:
  workflow_dispatch:
    inputs:
      attribution_id:
        description: "Report id (16 hex chars, the VV-xxxx reference without VV-)"
        required: true
      approver:
        description: "Your name (recorded on the report)"
        required: true
      decision:
        description: "approve or reject"
        type: choice
        options: [approve, reject]
        default: approve

permissions:
  contents: read

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-engine.txt
      - name: Record decision
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_KEY }}
          KAUN_AGENCY_CONTACTS: ${{ secrets.KAUN_AGENCY_CONTACTS }}
          ATTRIBUTION_ID: ${{ inputs.attribution_id }}
          APPROVER: ${{ inputs.approver }}
          DECISION: ${{ inputs.decision }}
        # Inputs go through env vars, never interpolated into the shell line;
        # queue.approve() whitelists both before they reach a query.
        # Approved reports go out in the next daily digest (kaun-report.yml).
        run: python -m reporting.queue "$DECISION" "$ATTRIBUTION_ID" --by "$APPROVER"
