<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaun? Who is polluting Delhi's air right now</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --bg:#fafafa;
          --low:#a1a1a6; --medium:#d68a00; --high:#1f7a3a; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--fg); background:var(--bg); }
  header { padding:20px 20px 8px; max-width:1100px; margin:auto; }
  h1 { margin:0; font-size:24px; }
  .sub { color:var(--muted); margin:4px 0 0; }
  main { max-width:1100px; margin:auto; padding:12px 20px 40px; display:grid; gap:20px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  #map { height:520px; border-radius:10px; border:1px solid var(--line); }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .card h3 { margin:0 0 4px; font-size:15px; }
  .meta { color:var(--muted); font-size:13px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:999px; color:#fff; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  .badge.low { background:var(--low); } .badge.medium { background:var(--medium); } .badge.high { background:var(--high); }
  .bar { display:flex; height:10px; border-radius:5px; overflow:hidden; margin:8px 0 4px; background:var(--line); }
  .legend span { margin-right:10px; font-size:12px; white-space:nowrap; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .note { font-size:13px; color:var(--muted); border-left:3px solid var(--line); padding-left:10px; }
  #empty { color:var(--muted); }
  footer { max-width:1100px; margin:auto; padding:0 20px 30px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Kaun? <span style="font-weight:400">/ कौन?</span></h1>
  <p class="sub">Hourly, observation-driven source estimates for pollution spikes at Delhi monitoring stations.</p>
  <p class="sub" id="generated"></p>
</header>
<main>
  <div id="map"></div>
  <section>
    <p class="note" id="disclaimer"></p>
    <div id="list"><p id="empty">Loading…</p></div>
  </section>
</main>
<footer>
  Data: CPCB/DPCC stations via OpenAQ, Open-Meteo wind, NASA FIRMS fires. Method and limits:
  <a href="https://github.com/shauryalowkeygotaura/vayuvani/blob/master/docs/KAUN.md">docs/KAUN.md</a>.
</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const COLORS = { traffic:"#3a6fd8", biomass_burning:"#c0392b", industry:"#7d3c98", dust:"#b9770e",
                 regional_background:"#8e8e93", transported_smoke:"#5d4037" };
const LABELS = { traffic:"Traffic", biomass_burning:"Biomass/garbage burning", industry:"Industry (SO2)",
                 dust:"Construction/road dust", regional_background:"Regional background",
                 transported_smoke:"Transported smoke" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ist = iso => new Date(iso).toLocaleString("en-IN", { timeZone:"Asia/Kolkata", day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" });

const map = L.map("map").setView([28.62, 77.20], 10);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom: 18, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);

function bar(shares) {
  return '<div class="bar">' + Object.entries(shares).sort((a,b)=>b[1]-a[1]).map(([k,v]) =>
    `<div title="${esc(LABELS[k]||k)} ${Math.round(v*100)}%" style="width:${(v*100).toFixed(1)}%;background:${COLORS[k]||"#ccc"}"></div>`).join("") + "</div>" +
    '<div class="legend">' + Object.entries(shares).sort((a,b)=>b[1]-a[1]).map(([k,v]) =>
    `<span><i class="dot" style="background:${COLORS[k]||"#ccc"}"></i>${esc(LABELS[k]||k)} ${Math.round(v*100)}%</span>`).join("") + "</div>";
}

fetch("data/latest.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(feed => {
    document.getElementById("generated").textContent = "Updated " + ist(feed.generated_at) + " IST";
    document.getElementById("disclaimer").textContent = feed.disclaimer || "";
    const byStation = {};
    (feed.attributions || []).forEach(a => byStation[a.station_id] = a);
    (feed.stations || []).forEach(s => {
      const a = byStation[s.id];
      const color = a ? (COLORS[a.top_source] || "#555") : "#c7c7cc";
      L.circleMarker([s.latitude, s.longitude], { radius: a ? 9 : 5, color, fillColor: color, fillOpacity: a ? .85 : .5, weight: 1 })
        .addTo(map).bindPopup(a ? `<b>${esc(s.name)}</b><br>${esc(a.summary_en)}<br>${esc(a.summary_hi)}` : `<b>${esc(s.name)}</b><br>No spike in the last 48 h`);
    });
    const list = document.getElementById("list");
    const items = feed.attributions || [];
    if (!items.length) { list.innerHTML = '<p id="empty">No spikes detected in the last 48 hours.</p>'; return; }
    list.innerHTML = items.map(a => `
      <div class="card">
        <h3>${esc(a.station_name)} <span class="badge ${esc(a.confidence)}">${esc(a.confidence)}</span></h3>
        <div class="meta">${ist(a.window_start)} to ${ist(a.window_end)} IST · peak PM2.5 ${esc(a.peak_pm25)} µg/m³ (baseline ${esc(a.baseline_pm25)})</div>
        ${bar(a.shares || {})}
        <div>${esc(a.summary_en)}</div>
        <div class="meta">${esc(a.summary_hi)}</div>
        ${(a.evidence?.confidence_notes || []).length ? `<div class="meta">Notes: ${esc(a.evidence.confidence_notes.join("; "))}</div>` : ""}
      </div>`).join("");
  })
  .catch(e => { document.getElementById("list").innerHTML = `<p id="empty">Feed not available yet (${esc(e.message)}).</p>`; });
</script>
</body>
</html>
